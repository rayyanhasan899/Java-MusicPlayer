name: Java compile and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - name: Compile
        run: javac -Xlint:all -d build Main.java Menu.java MusicPlayer.java PlaylistManager.java FileHandler.java tests/PlaybackTest.java
      - name: Test without audio hardware
        run: java -cp build PlaybackTest
